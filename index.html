<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#d71920">

    <title>PANAMED</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">

</head>

<body>

    <main class="app">

        <header class="encabezado">

            <h1>PANAMED</h1>

            <p>Asistencia de emergencia</p>

        </header>

        <section class="inicio">

            <h2>¿Qué está pasando?</h2>

            <p>
                Selecciona una situación para recibir
                orientación básica.
            </p>

            <button id="btnEmergencia"
                    class="boton-emergencia">

                LLAMAR A EMERGENCIAS

            </button>

        </section>

        <section class="situaciones">

            <button class="boton-situacion"
                    data-tipo="no-responde">

                Persona que no responde

            </button>

            <button class="boton-situacion"
                    data-tipo="respiracion">

                Problemas para respirar

            </button>

            <button class="boton-situacion"
                    data-tipo="sangrado">

                Sangrado

            </button>

            <button class="boton-situacion"
                    data-tipo="golpe">

                Golpe o caída

            </button>

        </section>

        <section id="guia"
                 class="guia"
                 hidden>

            <h2 id="tituloGuia"></h2>

            <div id="contenidoGuia"></div>

            <button id="volver">

                Volver

            </button>

        </section>

        <footer>

            <p>
                PANAMED es una herramienta de orientación
                y no sustituye a los servicios de emergencia
                ni a profesionales de la salud.
            </p>

        </footer>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
